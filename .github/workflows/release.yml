name: Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - zhivoymir
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Resolve version
        id: ver
        run: |
          name=$(grep '^launcher_version_name=' ZalithLauncher/gradle.properties | cut -d= -f2 | tr -d '\r')
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ver="${GITHUB_REF_NAME#v}"
            case "$name" in
              "$ver"|"$ver"-*) ;;
              *) echo "::error::Tag $GITHUB_REF_NAME does not match launcher_version_name=$name"; exit 1 ;;
            esac
          else
            ver="$name"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Version: $ver (versionName $name)"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            PetLib/rust/target
          key: petlib-rust-${{ runner.os }}-${{ hashFiles('PetLib/rust/Cargo.lock') }}
          restore-keys: petlib-rust-${{ runner.os }}-

      - name: Install cargo-ndk
        run: |
          version="4.1.2"
          curl -sL "https://github.com/bbqsrc/cargo-ndk/releases/download/v${version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" |
            tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*
          cargo ndk --version

      - name: Setup Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "Using NDK at $ndk"
          test -f "$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::KEYSTORE_B64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/zhivoymir.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/zhivoymir.jks" >> "$GITHUB_ENV"

      - name: Unit tests (packwiz sync)
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:testDebugUnitTest --tests 'com.movtery.zalithlauncher.zhivoymir.*' -Darch=arm64

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: ZalithLauncher/build/reports/tests/
          if-no-files-found: ignore

      - name: Build release APK (arm64-v8a)
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleRelease -Darch=arm64

      - name: Collect APK
        run: |
          mkdir -p dist
          apks=(ZalithLauncher/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -eq 1 || { ls -l ZalithLauncher/build/outputs/apk/release/; exit 1; }
          cp "${apks[0]}" "dist/ZhivoyMir-${{ steps.ver.outputs.version }}.apk"
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ZhivoyMir-${{ steps.ver.outputs.version }}
          path: dist/*.apk

      - name: Upload mapping
        uses: actions/upload-artifact@v7
        with:
          name: mapping-${{ steps.ver.outputs.version }}
          path: ZalithLauncher/build/outputs/mapping/release/mapping.txt

      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Живой мир ${{ steps.ver.outputs.version }}
          body: |
            Неофициальная модификация Zalith Launcher 2 (GPL-3.0) для сервера «Живой мир».
            Сборка: arm64-v8a, основа — ZalithLauncher2 2.8.2.
          files: dist/*.apk
          fail_on_unmatched_files: true
